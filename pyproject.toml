[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "verisearch"
version = "0.1.0"
description = "RL-trained retrieval reasoner with a faithfulness reward."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Ayesha Siddika" },
    { name = "Tahsinul Haque Dhrubo" },
]

# Core deps only. Must stay CPU-installable and fast: the Jenkins
# lint/typecheck/unit/integration stages install exactly this plus [dev].
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "pyyaml>=6.0,<7",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "ruff>=0.5",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "types-PyYAML>=6.0",
]

# Ayesha's half. Installed on the machine that builds the index.
retrieval = [
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
    "transformers>=4.43",
    "torch>=2.3",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

# Dhrubo's half. GPU box only. Never installed in the PR pipeline.
train = [
    "torch>=2.3",
    "transformers>=4.43",
    "peft>=0.11",
    "accelerate>=0.31",
    "vllm>=0.5",
    "datasets>=2.20",
    "wandb>=0.17",
    # Pinned to a minor, not a major. The P1 spike (#19) chose TRL's
    # `GRPOTrainer(rollout_func=...)`, and the masking guarantee rides on an
    # internal: TRL folds our `env_mask` into `loss_mask = completion_mask *
    # tool_mask`. That is behaviour cited by line number, not a documented API,
    # so a minor bump can move it without a changelog entry - and PROJECT.md
    # section 5 calls unmasked `<info>` tokens invisible in training curves.
    # Widen this only in a PR where `tests/test_masking.py` passed against the
    # new version first.
    "trl>=1.13,<1.14",
]

[tool.hatch.build.targets.wheel]
packages = ["verisearch"]

# ---------------------------------------------------------------------------
# mypy - PROJECT.md section 3. Do not relax without both owners approving.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_explicit = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]
files = ["verisearch"]

[[tool.mypy.overrides]]
module = ["faiss.*", "vllm.*", "peft.*", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["verisearch", "tests", "scripts"]
# Do not reformat Python snippets inside Markdown - PROJECT.md is the brief,
# not source, and its code blocks are illustrative.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "PT",            # pytest style
    "RET",           # return
    "ARG",           # unused arguments
    "PTH",           # use pathlib
    "TID",           # tidy imports
    "RUF",
]
ignore = [
    "E501",  # line length is enforced by the formatter
]

# PROJECT.md section 3: "from __future__ import annotations in every module".
# Enforced here so CI catches it instead of a reviewer.
[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
known-first-party = ["verisearch"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]        # fixtures are legitimately unused args
"scripts/*" = ["T201"]     # scripts print

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "gpu: requires a CUDA device (excluded from the PR pipeline)",
    "integration: end-to-end, fake retriever, CPU only, under 60s",
    "slow: excluded from the PR pipeline",
]

# ---------------------------------------------------------------------------
# coverage
# Floor is 80%. PROJECT.md scopes it to rewards/, env/, eval/metrics/ - those
# packages do not exist until P2, so the gate measures the whole package for
# now. Tighten the `source` list at P2 exit.
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["verisearch"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    # Protocol and stub bodies. Both forms: an ellipsis alone on its own line,
    # and the one-liner `def f(self, x: int) -> Y: ...`.
    #
    # Both patterns are anchored, and that is the point. They replace a bare
    # "\\.\\.\\." which, as a regex, matched *any* line containing three dots -
    # including every `-> tuple[X, ...]` annotation, which is required typing
    # syntax and appears throughout this codebase. coverage.py excludes the
    # entire block when an excluded line opens one, so every function returning
    # a tuple had its whole body dropped from measurement. Measured on one test
    # run of the data branch: 248 statements counted where there were 370. The
    # 80% floor was being enforced against roughly two thirds of the package,
    # and the modules worst affected were the ones that return tuples
    # everywhere - data/, faithfulness/, types.py.
    #
    # If you add a pattern here, check it against `-> tuple[X, ...]` first.
    "^\\s*\\.\\.\\.$",
    ":\\s*\\.\\.\\.$",
]
